[metadata]
name = airtraffic
version = 0.1.0
description = OpenSky state ingestion and air traffic analytics

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    fastavro==1.9.7
    kafka-python==2.2.15
    pyModeS==2.21.1
    minio==7.2.20
    pymongo==4.10.1

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    airtraffic-producer = airtraffic.jobs.producer:main
    airtraffic-import-raw = airtraffic.jobs.import_raw:main
    airtraffic-collect-states = airtraffic.jobs.collect_states:main
    airtraffic-process-states = airtraffic.jobs.process_states:main

[options.package_data]
airtraffic.serving = static/*.html, static/*.css, static/*.js
