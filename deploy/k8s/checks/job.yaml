apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-readiness
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: dns-and-storage
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              nslookup kubernetes.default.svc.cluster.local
              if [ -f /check/marker ]; then
                test "$(cat /check/marker)" = "airtraffic-storage-ok"
                echo "Existing PVC marker verified after pod recreation"
              else
                echo "airtraffic-storage-ok" > /check/marker
                sync
                test "$(cat /check/marker)" = "airtraffic-storage-ok"
                echo "PVC write/read verified; rerun Job to check persistence"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: storage
              mountPath: /check
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: readiness-storage
