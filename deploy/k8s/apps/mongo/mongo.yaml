apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  clusterIP: None
  selector: {app: mongo}
  ports:
    - {name: mongo, port: 27017, targetPort: 27017}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: {app: mongo}
  template:
    metadata:
      labels: {app: mongo}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:7.0@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
          args: [--wiredTigerCacheSizeGB, '0.25']
          ports:
            - {name: mongo, containerPort: 27017}
          envFrom:
            - secretRef: {name: airtraffic-mongo-bootstrap}
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts:
            - {name: database, mountPath: /data/db}
            - {name: initialization, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: initialization
          configMap: {name: airtraffic-mongo-init}
  volumeClaimTemplates:
    - metadata: {name: database}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: airtraffic-local-retain
        resources:
          requests: {storage: 10Gi}
