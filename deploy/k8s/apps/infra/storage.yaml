apiVersion: v1
kind: PersistentVolume
metadata:
  name: airtraffic-kafka-local
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: airtraffic-local-retain
  volumeMode: Filesystem
  local: {path: /srv/airtraffic/kafka}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [airtraffic-k8s]}
  claimRef: {namespace: airtraffic, name: kafka-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: airtraffic-local-retain
  volumeName: airtraffic-kafka-local
  resources:
    requests: {storage: 10Gi}
---
