apiVersion: batch/v1
kind: Job
metadata:
  name: airtraffic-topic-init
spec:
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
          command: [/opt/kafka/bin/kafka-topics.sh]
          args: [--bootstrap-server, kafka:9092, --create, --if-not-exists, --topic, airtraffic.states.opensky.v1, --partitions, '3', --replication-factor, '1', --config, 'retention.ms=604800000']
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
