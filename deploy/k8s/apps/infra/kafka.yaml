apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: airtraffic-kafka}
  ports:
    - {name: broker, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airtraffic-kafka
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: airtraffic-kafka}
  template:
    metadata:
      labels: {app: airtraffic-kafka}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: kafka
          image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
          ports:
            - {name: broker, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: CLUSTER_ID, value: 4L6g3nShT-eMCtK--X86sw}
            - {name: KAFKA_NODE_ID, value: '1'}
            - {name: KAFKA_PROCESS_ROLES, value: 'broker,controller'}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@localhost:9093'}
            - {name: KAFKA_LISTENERS, value: 'INTERNAL://:9092,CONTROLLER://:9093'}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: 'INTERNAL://kafka.airtraffic.svc.cluster.local:9092'}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1'}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: 'false'}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: '-Xms256m -Xmx512m'}
          startupProbe:
            tcpSocket: {port: broker}
            periodSeconds: 10
            failureThreshold: 24
          readinessProbe:
            tcpSocket: {port: broker}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: '2', memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: kafka-data}
