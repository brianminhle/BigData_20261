spark.master k8s://https://kubernetes.default.svc:443
spark.submit.deployMode client
spark.kubernetes.namespace airtraffic
spark.kubernetes.authenticate.caCertFile /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
spark.kubernetes.authenticate.oauthTokenFile /var/run/secrets/kubernetes.io/serviceaccount/token
spark.kubernetes.container.image airtraffic-state-stream:local
spark.kubernetes.container.image.pullPolicy IfNotPresent
spark.kubernetes.executor.podTemplateFile /etc/spark-batch/executor.yaml
spark.kubernetes.executor.podTemplateContainerName executor
spark.kubernetes.authenticate.executor.serviceAccountName spark-batch-executor
spark.executor.instances 2
spark.executor.cores 1
spark.executor.memory 768m
spark.executor.memoryOverhead 384m
spark.kubernetes.executor.request.cores 500m
spark.kubernetes.executor.limit.cores 1
spark.driver.memory 768m
spark.driver.bindAddress 0.0.0.0
spark.driver.port 7078
spark.blockManager.port 7079
spark.dynamicAllocation.enabled false
spark.scheduler.minRegisteredResourcesRatio 1.0
spark.scheduler.maxRegisteredResourcesWaitingTime 90s
spark.jars.ivy /tmp/ivy
spark.local.dir /tmp/spark-local
spark.kubernetes.executor.deleteOnTermination true
# Executors use emptyDir only; do not inspect or clean up application PVCs.
spark.kubernetes.driver.ownPersistentVolumeClaim false
spark.kubernetes.driver.reusePersistentVolumeClaim false
