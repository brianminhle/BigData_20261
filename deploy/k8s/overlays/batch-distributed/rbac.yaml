apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-batch-driver
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-batch-executor
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-batch-driver
rules:
  - apiGroups: ['']
    resources: [pods, services, configmaps]
    verbs: [get, list, watch, create, delete, deletecollection, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-batch-driver
subjects:
  - kind: ServiceAccount
    name: spark-batch-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-batch-driver
